<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>::before e ::after</title>
  <style>
    h1::before {
      content: "⭐ ";
      color: gold;
      font-size: 30px;
    }

    h1::after {
      content: " ⭐";
      color: gold;
      font-size: 30px;
    }

    .dica::before {
      content: "💡 ";
      font-size: 20px;
    }

    .dica::after {
      content: " ✨";
      font-size: 20px;
    }

    .citacao::before {
      content: '"';
      font-size: 40px;
      color: gray;
    }

    .citacao::after {
      content: '"';
      font-size: 40px;
      color: gray;
    }
  </style>
</head>

<body>
  <h1>Título com Estrelas</h1>

  <p class="dica">Esta é uma dica importante!</p>

  <p class="citacao">A prática leva à perfeição.</p>
</body>

</html>
