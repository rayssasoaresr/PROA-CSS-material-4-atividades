<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> c </title>
    <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    li {
      padding: 10px;
      margin: 5px 0;
      list-style: none;
    }

    li:nth-child(odd) {
      background-color: #f0f0f0;
    }

    li:nth-child(even) {
      background-color: white;
    }

    li:nth-child(3n) {
      color: blue;
      font-weight: bold;
    }

    li:first-child {
      background-color: yellow;
      font-weight: bold;
    }

    li:last-child {
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <h2>Lista Zebrada</h2>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
    <li>Item 5</li>
    <li>Item 6</li>
    <li>Item 7</li>
    <li>Item 8</li>
    <li>Item 9</li>
  </ul>
</body>
</html>
