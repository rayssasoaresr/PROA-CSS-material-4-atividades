<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:hover (Passar o Mouse)</title>
     <style>
    button {
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: blue;
      color: white;
    }

    a {
      color: black;
      text-decoration: none;
      font-size: 20px;
      padding: 5px;
    }

    a:hover {
      color: red;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Botão com Hover</h2>
  <button>Passe o mouse aqui</button>

  <h2>Link com Hover</h2>
  <a href="#">Passe o mouse aqui</a>
</body>
</html>
