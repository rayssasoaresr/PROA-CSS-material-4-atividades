<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSITION: RELATIVE</title>
  <style>
    .normal {
      width: 200px;
      height: 100px;
      background-color: lightblue;
      margin: 10px;
    }

    .relativo {
      position: relative;
      top: 20px;
      /* move 20px para BAIXO */
      left: 30px;
      /* move 30px para DIREITA */
      background-color: lightcoral;
    }
  </style>
</head>

<body>
  <div class="normal">Caixa Normal</div>
  <br>
  <br>

  <div class="normal relativo">Caixa Relative</div>

  <br>
  <br>

  <div class="normal">Caixa Normal</div>
</body>

</html>
